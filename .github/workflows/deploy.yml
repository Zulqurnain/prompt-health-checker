name: Build & Deploy to cPanel

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /tools.zulqurnainj.com/prompt-health-checker/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Fix permissions via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: YOUR_SFTP_PORT
          script: |
            chmod -R 755 ~/tools.zulqurnainj.com/prompt-health-checker/
            find ~/tools.zulqurnainj.com/prompt-health-checker/ -type f -exec chmod 644 {} \;
            echo "Permissions fixed"
            ls -la ~/tools.zulqurnainj.com/prompt-health-checker/
