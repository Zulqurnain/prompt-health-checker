name: Build & Deploy to cPanel

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /tools.zulqurnainj.com/prompt-health-checker/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Fix permissions and diagnose via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: YOUR_SFTP_PORT
          script: |
            echo "=== Home dir ==="
            ls -la ~/

            echo "=== tools.zulqurnainj.com root ==="
            ls -la ~/tools.zulqurnainj.com/ 2>/dev/null || echo "DIRECTORY NOT FOUND"

            echo "=== prompt-health-checker dir ==="
            ls -la ~/tools.zulqurnainj.com/prompt-health-checker/ 2>/dev/null || echo "DIR NOT FOUND"

            echo "=== Checking public_html tools ==="
            ls -la ~/public_html/ 2>/dev/null | grep -i tool || echo "no tools in public_html"

            echo "=== All subdomain dirs ==="
            ls -d ~/*/  2>/dev/null

            echo "=== Fixing perms ==="
            chmod -R 755 ~/tools.zulqurnainj.com/ 2>/dev/null || true
            find ~/tools.zulqurnainj.com/ -type f -exec chmod 644 {} \; 2>/dev/null || true

            echo "=== Write test file to verify web root ==="
            echo "ok" > ~/tools.zulqurnainj.com/test-deploy.txt
            echo "Test file written"
