name: Build & Deploy to cPanel

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Show dist contents
        run: |
          echo "=== dist/ ==="
          ls -la dist/
          echo "=== .htaccess ==="
          cat dist/.htaccess

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /tools.zulqurnainj.com/prompt-health-checker/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Fix permissions and verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: YOUR_SFTP_PORT
          script: |
            echo "=== All top-level dirs ==="
            ls -la ~/

            echo "=== tools dir ==="
            ls -la ~/tools.zulqurnainj.com/ 2>/dev/null || echo "tools dir NOT FOUND"

            echo "=== prompt-health-checker ==="
            ls -la ~/tools.zulqurnainj.com/prompt-health-checker/ 2>/dev/null || echo "PHC dir NOT FOUND"

            echo "=== index.html check ==="
            test -f ~/tools.zulqurnainj.com/prompt-health-checker/index.html && echo "index.html EXISTS" || echo "index.html MISSING"

            echo "=== .htaccess check ==="
            test -f ~/tools.zulqurnainj.com/prompt-health-checker/.htaccess && cat ~/tools.zulqurnainj.com/prompt-health-checker/.htaccess || echo ".htaccess MISSING"

            echo "=== Parent .htaccess ==="
            test -f ~/tools.zulqurnainj.com/.htaccess && cat ~/tools.zulqurnainj.com/.htaccess || echo "no parent .htaccess"

            echo "=== Fixing permissions ==="
            chmod -R 755 ~/tools.zulqurnainj.com/ || true
            find ~/tools.zulqurnainj.com/ -type f -exec chmod 644 {} \; || true
            echo "Done"

      - name: Verify from Actions runner (non-blocking)
        continue-on-error: true
        run: |
          sleep 5
          STATUS=$(curl -s -o /tmp/response.html -w "%{http_code}" --max-time 20 "https://tools.zulqurnainj.com/prompt-health-checker/")
          echo "HTTP Status: $STATUS"
          head -20 /tmp/response.html
          TITLE=$(grep -o '<title>[^<]*</title>' /tmp/response.html || echo "no title")
          echo "Title: $TITLE"
